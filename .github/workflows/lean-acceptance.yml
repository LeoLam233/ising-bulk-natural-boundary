name: Ising Lean acceptance preflight
on:
  push:
    branches:
      - codex/ising-lean-acceptance-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payload-and-production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: lean
    env:
      LEAN_NUM_THREADS: '2'
      LAKE_ARTIFACT_CACHE: 'false'
      LAKE_NO_CACHE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bind every proof-critical source and configuration byte
        run: python3 ci/verify_payload.py
      - name: Install exact official Lean runtime
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned official dependency cache
        run: |
          lean --version
          lake -f lakefile.toml exe cache get
          python3 ci/verify_payload.py --dependencies
      - name: Actually build the production Schur identity module
        run: lake -f lakefile.toml build IsingBulk.Algebra.SchurPfaffian
      - name: Recheck complete payload after execution
        run: python3 ci/verify_payload.py --dependencies
