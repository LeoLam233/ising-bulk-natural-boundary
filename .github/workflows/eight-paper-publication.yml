name: Eight-paper editorial publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript-identity-archive-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 scripts/verify_eight_papers.py --historical-checks
      - name: Install standalone manuscript build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended
      - name: Build all eight current manuscripts outside published source trees
        run: python3 scripts/build_current_papers.py --output "$RUNNER_TEMP/eight-current-papers"
      - run: python3 scripts/verify_eight_papers.py
