name: Eight-paper editorial publication
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript-identity-archive-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 scripts/verify_eight_papers.py --historical-checks
      - name: Install standalone manuscript build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build all eight current manuscripts outside published source trees
        run: python3 scripts/build_current_papers.py --output "$RUNNER_TEMP/eight-current-papers"
      - run: python3 scripts/verify_eight_papers.py
      - name: Preserve exact TeX build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eight-paper-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/eight-current-papers/**/*.stdout
            ${{ runner.temp }}/eight-current-papers/**/*.stderr
            ${{ runner.temp }}/eight-current-papers/**/*.log
            ${{ runner.temp }}/eight-current-papers/BUILD_RESULTS.json
          if-no-files-found: warn
          retention-days: 30
