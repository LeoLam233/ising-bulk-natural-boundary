name: ANISO C001 Lean acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aniso-build-strict-closure-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      LAKE_ARTIFACT_CACHE: 'false'
      LAKE_NO_CACHE: 'true'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify all frozen/protected source and manuscript identities
        run: python3 scripts/verify_three_proof_publication.py
      - name: Install exact official Lean 4.34.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Restore only pinned upstream dependency cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: lean/.lake/packages
          key: mathlib-linux-v4.34.1-${{ hashFiles('lean/lake-manifest.json') }}
      - name: Fetch official artifacts for pinned dependencies
        working-directory: lean
        run: lake -f lakefile.anisotropic.toml exe cache get
      - name: Execute clean ANISO build, strict audits, controls and fresh replay
        run: python3 -u scripts/run_three_proof_verification.py --only aniso --output "$RUNNER_TEMP/aniso-c001-verification"
      - name: Preserve exact argv, source/runtime identity and raw execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aniso-c001-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aniso-c001-verification/*/command.json
            ${{ runner.temp }}/aniso-c001-verification/*/receipt.json
            ${{ runner.temp }}/aniso-c001-verification/*/*.log
            ${{ runner.temp }}/aniso-c001-verification/compiler-slots/*.jsonl
            ${{ runner.temp }}/aniso-c001-verification/runtime-and-source-identity.json
            ${{ runner.temp }}/aniso-c001-verification/SUMMARY.json
          if-no-files-found: error
          retention-days: 90
