name: Assemble and publish verified high-temperature release assets
on:
  push:
    branches:
      - publication/ht-1747-assets-20261022
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: high-temperature-1747-release-publication
  cancel-in-progress: false
jobs:
  release-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble exact evidence and enforce publication gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u publish_release_assets.py
      - name: Preserve the release operation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: high-temperature-release-operation-${{ github.sha }}
          path: ${{ runner.temp }}/release-operation.json
          if-no-files-found: ignore
          retention-days: 90
