name: One-time HT-PSER TeX/PDF synchronization
on:
  push:
    branches: [ht-pser-opus-editorial-20261031]
    paths:
      - '.github/workflows/ht-pser-one-time-pdf-sync.yml'
permissions:
  contents: write
jobs:
  update-current-paper-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned-scope LaTeX dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Rebuild the actual current HT-PSER PDF (three passes)
        run: |
          set -euo pipefail
          cd papers/high-temperature/alternative-proof
          for k in 1 2 3; do
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error manuscript.tex > "$RUNNER_TEMP/ht-pser-pass-$k.log" 2>&1
          done
          ! grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Overfull \\hbox|Missing character:' manuscript.log
          pdfinfo manuscript.pdf | grep Pages
      - name: Update only the current HT-PSER TeX/PDF SHA-256 identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path(".")
          path=root/"provenance/eight-papers-2026-10-30/MIGRATION.json"
          m=json.loads(path.read_text())
          for rel in ["papers/high-temperature/alternative-proof/manuscript.tex","papers/high-temperature/alternative-proof/manuscript.pdf"]:
              assert rel in m["current_pairs"]
              b=(root/rel).read_bytes()
              m["current_pairs"][rel]["sha256"]=hashlib.sha256(b).hexdigest()
              print(rel,len(b),m["current_pairs"][rel]["sha256"])
          path.write_text(json.dumps(m,indent=2,ensure_ascii=False)+"\n")
          PY
      - name: Remove temporary workflow and publish reviewed source/PDF/receipt
        run: |
          set -euo pipefail
          rm -f .github/workflows/ht-pser-one-time-pdf-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/high-temperature/alternative-proof/manuscript.tex papers/high-temperature/alternative-proof/manuscript.pdf provenance/eight-papers-2026-10-30/MIGRATION.json
          git add -u .github/workflows/ht-pser-one-time-pdf-sync.yml
          git commit -m "Rebuild audited HT-PSER paper and refresh current publication checksums"
          git push origin HEAD:ht-pser-opus-editorial-20261031
